name: Parse Autohome Catalog

on:
  schedule:
    # каждый понедельник в 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      years:
        description: 'Максимальный возраст авто (лет)'
        required: false
        default: '3'
      time_budget:
        description: 'Лимит времени, минут'
        required: false
        default: '300'
      brands:
        description: 'Только эти brand_id через запятую (для теста, пусто = все)'
        required: false
        default: ''
      reset:
        description: 'Сбросить состояние обхода'
        type: boolean
        required: false
        default: false

# один запуск за раз, иначе состояние обхода перетирается
concurrency:
  group: autohome-parser
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    defaults:
      run:
        working-directory: autohome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      # состояние обхода переносится между запусками,
      # чтобы длинный обход можно было разбить на части
      - name: Restore crawl state
        uses: actions/cache/restore@v4
        with:
          path: autohome/state.json
          key: autohome-state-${{ github.run_id }}
          restore-keys: |
            autohome-state-

      - name: Run parser
        run: |
          ARGS="--years ${{ github.event.inputs.years || '3' }}"
          ARGS="$ARGS --time-budget ${{ github.event.inputs.time_budget || '300' }}"
          if [ -n "${{ github.event.inputs.brands }}" ]; then
            ARGS="$ARGS --brands ${{ github.event.inputs.brands }}"
          fi
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            ARGS="$ARGS --reset"
          fi
          echo "Аргументы: $ARGS"
          python main.py $ARGS

      - name: Save crawl state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: autohome/state.json
          key: autohome-state-${{ github.run_id }}

      - name: Commit data
        if: always()
        working-directory: .
        run: |
          git config user.email "claude@anthropic.com"
          git config user.name "Claude"
          git add autohome/data
          if git diff --staged --quiet; then
            echo "Изменений в данных нет"
          else
            git commit -m "update autohome catalog ($(date -u +%Y-%m-%d)) [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f data/index.json ]; then
            python -c "import json,sys; d=json.load(open('data/index.json',encoding='utf-8')); c=d['counts']; print('Обновлено:', d['updated_at']); print('Обход завершён полностью:', d['complete']); print('Марок:', c['brands'], '| моделей:', c['models'], '| комплектаций:', c['trims'])"
          else
            echo "data/index.json не создан"
          fi
